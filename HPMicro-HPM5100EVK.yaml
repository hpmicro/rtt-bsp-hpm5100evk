board:
  buy_url_cn: http://www.hpmicro.com
  buy_url_global: http://www.hpmicro.com
  debug_interface: JTAG
  debugger: FT2232
  description_en: The HPM5100 is a single-core MCU with high computing power and abundant peripheral resources. The HPM5100EVK is an evaluation board for the HPM5100 series MCU, providing a range of interfaces including ADC input, motor control interface (QEO/QEI/SEI/PWM/ADC), CAN interface, USB interface, audio interface, and Raspberry Pi interface. It also integrates an onboard debugger CMSIS-DAP for easy debugging by users.
  description_zh: HPM5100是一款基于RISC-V内核的MCU，具有很高的算力和丰富的外设资源。HPM5100EVK为HPM5100系列MCU的评估板，提供了一系列接口，包括ADC输入接口，电机控制接口(QEO/QEI/PWM/ADC)、CAN接口、USB接口、音频接口和树莓派接口，并集成板载调试器CMSIS-DAP，方便用户进行调试。
  emulator_machine: ''
  large_image: documents/images/board_5100evk_large.png
  name: HPM5100EVK
  price_cn: 258.00 CNY
  price_global: 39.00 USD
  sale_contact_cn: http://www.hpmicro.com/
  sale_contact_global: http://www.hpmicro.com/
  small_image: documents/images/board_5100evk_small.png
  vendor: HPMicro
  version: Rev.A
chip:
  chip_name: HPM5151
  clock_source: HSE
  device_vendor: HPMicro
  family_name: HPM5100
  rx_name: PA01
  series_name: HPM5100
  source_freq: '24000000'
  sub_series_name: HPM5100
  target_freq: '400000000'
  tx_name: PA00
  uart_name: UART0

docs:
- category: manual
  file: documents/manuals/HPM5100EVK_UG_V1.0.pdf
  title: HPM5100EVK Quick Start Guide
- category: sheet
  file: documents/sheet/HPM5100_DS_V0_2.pdf
  title: HPM5100 Datasheet
features:
- 'MCU: HPM5151 MCU (360MHz, 288KB SRAM)'
- 'On-Board 1MB Quad SPI NOR Flash'
- 'Buttons: 2, RESET, WKUP'
- 'Debug Interface: 20-PIN JTAG interface'
- 'USB: USB type C (USB 2.0 OTG) connector x1'
- 'Audio: Line in, Mic, Speaker, DAO'
- 'Motor Control: QEO/QEI/PWM/ADC'
- 'Others: CANFD, RGB LED'
features_zh:
- 'MCU: HPM5151 微控制器 (主频400Mhz, 384KB + 32KB 片上SRAM)'
- '板载 1MB Quad SPI NOR Flash'
- '按键： 2, RESET, WKUP'
- '调试接口: 20-PIN JTAG接口'
- 'USB: USB type C (USB 2.0 OTG) connector x1'
- '音频: Line in, Mic, Speaker'
- '电机控制: PWM/ADC'
- '其他: CANFD, LED'

pkg_type: Board_Support_Packages
pkg_vendor: HPMicro
pkg_version: 1.13.0

